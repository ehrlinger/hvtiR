# The chooser is the only place to redirect a report before it is written.
# hvtiR is the package everyone installs, so it is where issues about every
# other family package arrive. These links duplicate the registry in
# R/members.R and must be updated when a member is renamed -- which is also
# when test-registry-live.R fails, so those two move together.
#
# Blank issues stay enabled on purpose: there is no feature-request template
# here, so the blank issue is the path for enhancements and for anything the
# three templates do not fit.

blank_issues_enabled: true

contact_links:
  - name: Issue with hvtiRutilities
    url: https://github.com/ehrlinger/hvtiRutilities/issues
    about: >-
      hvtiRutilities has its own tracker. Reporting it there reaches the code that
      needs to change; this repository only installs it.
