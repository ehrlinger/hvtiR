name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # No `release:` trigger, deliberately. A release here tags a commit that is
  # already on main, and the push that merged it has already built and deployed
  # it. A release-triggered run can only repeat that deploy or, when main has
  # moved on, overwrite the site with an older commit: hvtiRlifetables v0.1.3
  # (tagged at f024064) did that on 2026-09-11 and rolled the live help pages
  # back past the ehrlinger/hvtiRlifetables#20 fix. The site documents main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Fails fast on a malformed catalog, before the R toolchain is set up.
      # A short or broken package list must never reach the CV sinks.
      - name: Test the catalog converter
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Publish members.json
        run: python3 tools/catalog_to_json.py --out docs/members.json

      - name: Store site
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: pkgdown
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve site
        uses: actions/download-artifact@v4
        with:
          name: pkgdown-site
          path: docs

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
