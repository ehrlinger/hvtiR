name: jobs-pin-drift

# `inst/extdata/jobs.json` is read by sibling repositories rather than imported
# -- hvtiR installs the family, so a DESCRIPTION entry would invert the
# dependency. hvtiRtemplates therefore checks the catalog out by TAG, in both
# `R-CMD-check.yaml` and `spec-counts.yaml`, so that editing the catalog here
# cannot fail every pull request there. That is the right call and it has a
# shelf life: once `main` moves past the newest tag, the pin still resolves and
# both sides stay green while the consumer validates against an older catalog.
# Between v1.1.3 and v1.1.5 that gap was fourteen changed rows and nothing
# reported it. It closed because somebody advanced the pin by hand.
#
# Firing needs no list of consumers -- if main has moved past the newest tag
# then every pin is stale whatever tag it names. CLEARING does need one, and
# that asymmetry is the whole design. `main == newest tag` says a tag holding
# the current catalog EXISTS; it says nothing about which tag anybody checks
# out. An earlier version of this file closed the issue on it, which shut the
# alarm halfway through the remedy it had just printed -- tag cut, consumer
# refs untouched, quiet forever. So the refs are read and compared, and any
# state that cannot be verified leaves the alarm standing.
#
# It reports into ONE reused issue rather than opening a pull request, which is
# where it differs from `catalog-versions.yml`. That job's remedy is a data
# edit, so a pull request whose diff IS the report is exactly right. Here the
# remedy is to name a version, tag it, and advance the pin in another
# repository -- a maintainer's decision. A pull request nobody can merge is
# worse than an issue.
#
# It does not fail. There is nothing a red check would make anyone do faster.

on:
  schedule:
    # Mondays 06:30 UTC, half an hour behind catalog-versions so the two do not
    # land in the same minute and read as one event.
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pin-drift:
    runs-on: ubuntu-latest
    steps:
      # Full history AND tags: the check is main against the newest tag, and a
      # shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Read from each consumer's default branch, so the check sees what those
      # repositories actually run today rather than what they ran when this
      # list was written. A fetch that fails leaves no file, and a consumer the
      # script cannot read is PENDING, never CURRENT -- so a bad token or a
      # renamed workflow keeps the alarm up instead of silently clearing it.
      - name: Fetch the workflow files that pin this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/consumers
          for wf in R-CMD-check spec-counts; do
            gh api "repos/ehrlinger/hvtiRtemplates/contents/.github/workflows/$wf.yaml" \
              --jq '.content' 2>/dev/null | base64 -d > "/tmp/consumers/$wf.yaml" || true
            if [ ! -s "/tmp/consumers/$wf.yaml" ]; then
              rm -f "/tmp/consumers/$wf.yaml"
              echo "::warning::Could not read hvtiRtemplates' $wf.yaml; its pin cannot be verified this run."
            fi
          done

      - name: Compare the catalog on main against the newest tag
        id: check
        run: |
          set +e
          # Sorted by version, not by creation date -- a tag cut out of order
          # would otherwise be read as the newest.
          tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "::notice::No version tag exists yet, so nothing can be pinned to one."
            echo "status=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show "$tag:inst/extdata/jobs.json" > /tmp/tagged.json 2>/dev/null
          if [ ! -s /tmp/tagged.json ]; then
            echo "::error::$tag carries no inst/extdata/jobs.json, so the comparison could not be made."
            exit 1
          fi

          # When the window OPENED: the first commit after the tag to touch the
          # catalog, not the most recent one. Using the latest would reset the
          # clock on every edit and a catalog changed weekly would never age
          # past the grace period.
          opened="$(git log --reverse --format=%ct "$tag..HEAD" -- inst/extdata/jobs.json | head -n 1)"
          if [ -z "$opened" ]; then
            ahead_days=0
          else
            ahead_days=$(( ( $(date -u +%s) - opened ) / 86400 ))
          fi

          # Days since the tag was cut, so a consumer gets the same grace to
          # advance its ref as the catalog gets to sit unreleased.
          tag_age_days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct "$tag") ) / 86400 ))

          python3 tools/check_jobs_pin.py \
            --current inst/extdata/jobs.json \
            --tagged /tmp/tagged.json \
            --tag "$tag" \
            --ahead-days "$ahead_days" \
            --tag-age-days "$tag_age_days" \
            --consumer "hvtiRtemplates R-CMD-check.yaml=/tmp/consumers/R-CMD-check.yaml" \
            --consumer "hvtiRtemplates spec-counts.yaml=/tmp/consumers/spec-counts.yaml" \
            | tee /tmp/report.md
          status=${PIPESTATUS[0]}
          set -e

          # An ALLOWLIST. 0 and 2 are the only codes the script returns
          # deliberately; an uncaught exception exits 1, and a `-ge 2` test
          # would read a crash as "no drift" and end the run green.
          # An ALLOWLIST of the codes the script returns on purpose. 3 is
          # PENDING: known-not-verified, which must neither raise the alarm nor
          # clear it.
          case "$status" in
            0|2|3) ;;
            *) echo "::error::check_jobs_pin.py exited $status, which it never does deliberately."
               exit "$status" ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Open or update the one tracking issue
        if: steps.check.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Job catalog on main has outrun its newest tag"
        run: |
          body="$(cat /tmp/report.md)"
          # Reused deliberately: a new issue per week would bury the first one,
          # which is the one carrying the history of how long this has been open.
          existing="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "::notice::Updated issue #$existing."
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

      # Closing is part of the loop -- an issue left open after the refs moved
      # is a stale alarm, and a tracker people learn to ignore is worse than no
      # tracker. But it closes ONLY on CURRENT, which means the catalog is
      # tagged AND every consumer ref was read AND every one of them names that
      # tag. PENDING (3) deliberately does neither.
      - name: Close the tracking issue once every consumer reads the new tag
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Job catalog on main has outrun its newest tag"
        run: |
          existing="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The catalog on \`main\` is tagged ${{ steps.check.outputs.tag }} and every consumer pins it; closing."
          fi

      # PENDING is a real state and must not look like a clean run: it is how
      # "nobody could be asked" and "everything is fine" stop being the same
      # log line.
      - name: Say so when the pins could not be verified
        if: steps.check.outputs.status == '3'
        run: |
          echo "::notice::Not verified current this run -- see the comparison step. The tracking issue, if any, was deliberately left as it was." 
