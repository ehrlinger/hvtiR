name: jobs-pin-drift

# `inst/extdata/jobs.json` is read by sibling repositories rather than imported
# -- hvtiR installs the family, so a DESCRIPTION entry would invert the
# dependency. hvtiRtemplates therefore checks the catalog out by TAG, in both
# `R-CMD-check.yaml` and `spec-counts.yaml`, so that editing the catalog here
# cannot fail every pull request there. That is the right call and it has a
# shelf life: once `main` moves past the newest tag, the pin still resolves and
# both sides stay green while the consumer validates against an older catalog.
# Between v1.1.3 and v1.1.5 that gap was fourteen changed rows and nothing
# reported it. It closed because somebody advanced the pin by hand.
#
# It reports into ONE reused issue rather than opening a pull request, which is
# where it differs from `catalog-versions.yml`. That job's remedy is a data
# edit, so a pull request whose diff IS the report is exactly right. Here the
# remedy is to name a version, tag it, and advance the pin in another
# repository -- a maintainer's decision. A pull request nobody can merge is
# worse than an issue.
#
# It does not fail. There is nothing a red check would make anyone do faster.

on:
  schedule:
    # Mondays 06:30 UTC, half an hour behind catalog-versions so the two do not
    # land in the same minute and read as one event.
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pin-drift:
    runs-on: ubuntu-latest
    steps:
      # Full history AND tags: the check is main against the newest tag, and a
      # shallow clone has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare the catalog on main against the newest tag
        id: check
        run: |
          set +e
          # Sorted by version, not by creation date -- a tag cut out of order
          # would otherwise be read as the newest.
          tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "::notice::No version tag exists yet, so nothing can be pinned to one."
            echo "status=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show "$tag:inst/extdata/jobs.json" > /tmp/tagged.json 2>/dev/null
          if [ ! -s /tmp/tagged.json ]; then
            echo "::error::$tag carries no inst/extdata/jobs.json, so the comparison could not be made."
            exit 1
          fi

          # When the window OPENED: the first commit after the tag to touch the
          # catalog, not the most recent one. Using the latest would reset the
          # clock on every edit and a catalog changed weekly would never age
          # past the grace period.
          opened="$(git log --reverse --format=%ct "$tag..HEAD" -- inst/extdata/jobs.json | head -n 1)"
          if [ -z "$opened" ]; then
            ahead_days=0
          else
            ahead_days=$(( ( $(date -u +%s) - opened ) / 86400 ))
          fi

          python3 tools/check_jobs_pin.py \
            --current inst/extdata/jobs.json \
            --tagged /tmp/tagged.json \
            --tag "$tag" \
            --ahead-days "$ahead_days" | tee /tmp/report.md
          status=${PIPESTATUS[0]}
          set -e

          # An ALLOWLIST. 0 and 2 are the only codes the script returns
          # deliberately; an uncaught exception exits 1, and a `-ge 2` test
          # would read a crash as "no drift" and end the run green.
          case "$status" in
            0) ;;
            2) ;;
            *) echo "::error::check_jobs_pin.py exited $status, which it never does deliberately."
               exit "$status" ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Open or update the one tracking issue
        if: steps.check.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Job catalog on main has outrun its newest tag"
        run: |
          body="$(cat /tmp/report.md)"
          # Reused deliberately: a new issue per week would bury the first one,
          # which is the one carrying the history of how long this has been open.
          existing="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "::notice::Updated issue #$existing."
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

      # Closing it is part of the loop. An issue left open after the pin was
      # advanced is a stale alarm, and a tracker people learn to ignore is
      # worse than no tracker.
      - name: Close the tracking issue once the catalog matches its tag again
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Job catalog on main has outrun its newest tag"
        run: |
          existing="$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The catalog on \`main\` matches ${{ steps.check.outputs.tag }} again; closing."
          fi
