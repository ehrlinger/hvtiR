name: version-check

# Two branches bumping to the same version do not conflict in git: the
# identical `Version:` line merges silently and only NEWS.md shows a conflict.
# Resolving just what git shows then ships two releases claiming one number.
# That happened twice in one day, which is why this job exists.
#
# Consequence: every pull request must move the patch digit, including
# CI-only and docs-only ones. That is deliberate. Allowing an unchanged
# version would let the collision through, because a branch rebased onto a
# main that already took its number looks exactly like "no bump".
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base branch to compare against

      - name: Test the version guard
        run: python3 -m unittest discover -s tools -p 'test_check_version.py'

      - name: Read the base branch's DESCRIPTION
        run: git show origin/${{ github.base_ref }}:DESCRIPTION > "${RUNNER_TEMP}/base-DESCRIPTION"

      - name: Check the version moved past the base branch
        run: python3 tools/check_version.py --base-description "${RUNNER_TEMP}/base-DESCRIPTION"
