name: version-check

# Two branches bumping to the same version do not conflict in git: the
# identical `Version:` line merges silently and only NEWS.md shows a conflict.
# Resolving just what git shows then ships two releases claiming one number.
# That happened twice in one day, which is why this job exists.
#
# The guard used to require every pull request to bump, for that reason: a
# branch rebased onto a main that already took its number looks exactly like
# one that never bumped. Under the house-style cadence most pull requests
# deliberately leave the version alone, so that rule would fail nearly all of
# them. NEWS.md separates the two cases. Work that is not being versioned
# lands under the standing "# hvtiR (unreleased)" heading, so an unchanged
# version passes only when that heading is present and the collision stays a
# failure.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base branch to compare against

      - name: Test the version guard
        run: python3 -m unittest discover -s tools -p 'test_check_version.py'

      - name: Read the base branch's DESCRIPTION
        run: git show origin/${{ github.base_ref }}:DESCRIPTION > "${RUNNER_TEMP}/base-DESCRIPTION"

      # A pull request whose every file .Rbuildignore excludes ships nothing,
      # so the house style gives it no NEWS entry and no bump. The script needs
      # the file list to tell that case apart. HEAD is the pull request's merge
      # commit, so the three-dot diff against the base is exactly what the pull
      # request adds. The patterns come from the base branch, so a pull request
      # cannot exempt itself by adding one.
      - name: List the files this pull request changes
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "${RUNNER_TEMP}/changed-files"
          git show "origin/${{ github.base_ref }}:.Rbuildignore" > "${RUNNER_TEMP}/base-Rbuildignore"

      - name: Check the version against the base branch
        run: >-
          python3 tools/check_version.py
          --base-description "${RUNNER_TEMP}/base-DESCRIPTION"
          --changed-files "${RUNNER_TEMP}/changed-files"
          --rbuildignore "${RUNNER_TEMP}/base-Rbuildignore"
