name: version-check

# Two branches bumping to the same version do not conflict in git: the
# identical `Version:` line merges silently and only NEWS.md shows a conflict.
# Resolving just what git shows then ships two releases claiming one number.
# That happened twice in one day, which is why this job exists.
#
# The guard used to require every pull request to bump, for that reason: a
# branch rebased onto a main that already took its number looks exactly like
# one that never bumped. Under the house-style cadence most pull requests
# deliberately leave the version alone, so that rule would fail nearly all of
# them. The NEWS fragment separates the two cases. Work that is not being
# versioned adds its entry as news/<branch>.md, so an unchanged version passes
# only when the pull request adds one and the collision stays a failure. That
# makes this job the fragment guard too, so hvtiR runs no separate
# news-fragment job.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One in-flight run per workflow per ref. Without this every push starts a
  # fresh run while the superseded one keeps holding a runner, and the queue
  # grows faster than it drains -- one run sat queued for 410 minutes on
  # 2026-08-17 behind work that had already been replaced. Protected branches
  # are exempt, so a release run is never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base branch to compare against

      - name: Test the version guard
        run: python3 -m unittest discover -s tools -p 'test_check_version.py'

      # hvtiR has no news-fragment job (this one is its guard), so the shared
      # fragment tooling the bump runs is tested here instead.
      - name: Test the NEWS fragment tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_news.py'

      - name: Read the base branch's DESCRIPTION
        run: git show origin/${{ github.base_ref }}:DESCRIPTION > "${RUNNER_TEMP}/base-DESCRIPTION"

      # A pull request whose every file .Rbuildignore excludes ships nothing,
      # so the house style gives it no NEWS entry and no bump. The script needs
      # the file list to tell that case apart, and the added files to see a
      # news/ fragment. HEAD is the pull request's merge
      # commit, so the three-dot diff against the base is exactly what the pull
      # request adds. The patterns come from the base branch, so a pull request
      # cannot exempt itself by adding one.
      - name: List the files this pull request changes
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > "${RUNNER_TEMP}/changed-files"
          git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" > "${RUNNER_TEMP}/added-files"
          git show "origin/${{ github.base_ref }}:.Rbuildignore" > "${RUNNER_TEMP}/base-Rbuildignore"

      - name: Check the version against the base branch
        run: >-
          python3 tools/check_version.py
          --base-description "${RUNNER_TEMP}/base-DESCRIPTION"
          --changed-files "${RUNNER_TEMP}/changed-files"
          --added-files "${RUNNER_TEMP}/added-files"
          --rbuildignore "${RUNNER_TEMP}/base-Rbuildignore"

      # A bump ships the catalog as it stands, and the weekly refresh is only
      # as fresh as its last run. hvtiR 1.3.10 nearly shipped hvtiRdatabuild
      # 0.3.6 after 0.3.7 was released between the refresh and the bump
      # (2026-11-18, caught by review, not by a check). So a pull request that
      # moves Version: must carry a catalog that matches every oracle now.
      # Only the bump: on any other pull request a member's release would turn
      # unrelated work red until the next refresh merged.
      - name: Check the catalog is current (version bumps only)
        run: |
          base=$(sed -n 's/^Version: *//p' "${RUNNER_TEMP}/base-DESCRIPTION")
          head=$(sed -n 's/^Version: *//p' DESCRIPTION)
          if [ "$base" = "$head" ]; then
            echo "Version: unchanged ($head); no catalog check."
            exit 0
          fi
          set +e
          python3 tools/refresh_catalog_versions.py --check
          status=$?
          set -e
          case "$status" in
            0) echo "Catalog matches every member's main and CRAN." ;;
            1) echo "::error::The catalog is stale for this bump (drift above). Run catalog-versions.yml, merge its pull request, then update this branch from main."
               exit 1 ;;
            2) echo "::error::An oracle could not be read, so the catalog was not verified. Re-run this job; a bump does not ship an unverified catalog."
               exit 1 ;;
            3) echo "::error::A member declares a hard floor its dependency's main does not meet (above); install() fails until it is fixed."
               exit 1 ;;
            *) echo "::error::refresh_catalog_versions.py --check exited $status, which it never does deliberately."
               exit 1 ;;
          esac
