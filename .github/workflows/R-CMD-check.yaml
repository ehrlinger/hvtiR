name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Must cover every package named in replaced_by in inst/extdata/jobs.json,
          # and nothing else: R CMD check installs all of Suggests, so an extra
          # entry is compiled on every run for nothing. A package named here but
          # not in replaced_by is dead weight; one in replaced_by but missing here
          # fails test-jobs-routing.R with "UNVALIDATED routings".
          extra-packages: >
            any::rcmdcheck,
            ehrlinger/hvtiPlotR,
            ehrlinger/ggRandomForests
          needs: check

      # Install the package into the user library so that Quarto's subprocess
      # can resolve library(hvtiR) during vignette rendering.
      - name: Install package for vignette rendering
        run: Rscript -e "install.packages('.', repos = NULL, type = 'source')"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # --no-manual: building the PDF manual on CI needs a LaTeX install
          # this workflow does not set up. The manual check runs separately
          # in check-manual.yaml.
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: '"warning"'
