url: https://ehrlinger.github.io/hvtiR/

template:
  bootstrap: 5
  bslib:
    bootswatch: zephyr
    base_font:
      google: Outfit
    code_font:
      google: Fira Code
  light-switch: yes
  theme: atom-one-light
  theme-dark: atom-one-dark

home:
  sidebar:
    structure:
    - badges
    - links
    - authors
    components:
      badges:
        title: Package badges
        text: |
          ![R package version](https://img.shields.io/github/r-package/v/ehrlinger/hvtiR)<br>
          ![pkgdown build status](https://img.shields.io/github/actions/workflow/status/ehrlinger/hvtiR/pkgdown.yaml)<br>

# hvtiR.qmd would otherwise take "Get started", by its name. The first page a
# reader needs is the one that sets up a study, so the link goes there.
navbar:
  structure:
    right:
    - search
    - github
    - my_linkedin
    - lightswitch
  components:
    intro:
      text: Get started
      href: articles/start-here.html
    articles:
      text: Articles
      menu:
      - text: Start here
        href: articles/start-here.html
      - text: Install, update and check the family
        href: articles/hvtiR.html
    my_linkedin:
      icon: fa-linkedin
      href: https://www.linkedin.com/in/ehrlinger/
      aria-label: LinkedIn

reference:
- title: Package overview
  contents:
  - hvtiR-package

- title: Installing
  desc: Install and update the package family
  contents:
  - install
  - update
  - setup

- title: Checking
  desc: Report what is installed and diagnose what is wrong
  contents:
  - status
  - doctor

- title: The registry
  desc: Which packages are members, and where they come from
  contents:
  - members

articles:
- title: Getting started
  navbar: ~
  contents:
  - start-here
  - hvtiR
